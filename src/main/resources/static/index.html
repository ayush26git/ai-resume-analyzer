<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Resume Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="header">
        <h1>AI Resume Analyzer</h1>
        <p>Analyze your resume against a job description</p>
    </div>

    <div class="card">

        <h2>Resume Analysis</h2>

        <form id="resumeForm">

            <label>Upload Resume</label>

            <input
                    type="file"
                    id="resumeFile"
                    accept=".pdf"
                    required
            >

            <label>Job Description</label>

            <textarea
                    id="jobDescription"
                    rows="10"
                    placeholder="Paste the job description here..."
                    required>
            </textarea>

            <button type="submit">
                Analyze Resume
            </button>

        </form>

    </div>

    <div class="card" id="result">

        <h2>Analysis Result</h2>

        <div class="score">

            <p>Resume Match Score</p>
            <div class="score-circle" id="scoreCircle">
                <span id="score">0%</span>
            </div>

            <div class="progress-bar">
                <div class="progress" id="progress"></div>
            </div>

        </div>

        <div class="result-section">

            <h3>Matched Skills</h3>

            <div class="skills" id="matchedSkills"></div>

        </div>

        <div class="result-section">

            <h3>Missing Skills</h3>

            <div class="skills" id="missingSkills"></div>

        </div>

    </div>

</div>

<script>
    document.getElementById("resumeForm").addEventListener("submit", async function(event) {

        event.preventDefault();
        const button = document.querySelector("button");

        button.textContent = "Analyzing...";
        button.disabled = true;

        const file = document.getElementById("resumeFile").files[0];

        const jobDescription =
            document.getElementById("jobDescription").value;

        const formData = new FormData();

        formData.append("file", file);
        formData.append("jobDescription", jobDescription);

        const response = await fetch("/api/resume/analyze", {
            method: "POST",
            body: formData
        });
        if (!response.ok) {
            alert("Something went wrong. Please try again.");
            button.textContent = "Analyze Resume";
            button.disabled = false;
            return;
        }

        const result = await response.json();
        button.textContent = "Analyze Resume";
        button.disabled = false;

        document.getElementById("result").style.display = "block";

        document.getElementById("score").textContent =
            result.score + "%";
        document.getElementById("progress").style.width =
            result.score + "%";

        document.getElementById("matchedSkills").innerHTML =
            result.matchedSkills.length > 0
                ? result.matchedSkills
                    .map(skill => `<span class="skill matched">✓ ${skill}</span>`)
                    .join("")
                : "<p>No matching skills found.</p>";

        document.getElementById("missingSkills").innerHTML =
            result.missingSkills.length > 0
                ? result.missingSkills
                    .map(skill => `<span class="skill missing">✗ ${skill}</span>`)
                    .join("")
                : "<p>No missing skills. Great match!</p>";

    });



</script>

</body>
</html>
